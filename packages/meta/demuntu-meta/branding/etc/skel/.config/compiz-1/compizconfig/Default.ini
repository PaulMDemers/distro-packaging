[core]
s0_active_plugins = core;composite;opengl;decor;place;move;resize;regex;matecompat;session;imgpng;cube;rotate;expo;scale;workarounds;animation;ezoom;
s0_hsize = 4
s0_vsize = 1

[decor]
s0_command = /usr/bin/gtk-window-decorator --replace

[cube]
s0_color = #1b1c22ff
s0_skydome = true
s0_skydome_image = /usr/share/backgrounds/demuntu/demuntu-default.png
s0_active_opacity = 92.000000
s0_inactive_opacity = 80.000000

[rotate]
s0_snap_top = true
s0_speed = 2.200000
s0_timestep = 0.500000

[expo]
s0_expo_key = <Super>e
s0_reflection = true

[scale]
s0_initiate_key = <Super>w

[animation]
s0_open_effects = animation:Glide 2;
s0_close_effects = animation:Glide 2;
s0_minimize_effects = animation:Magic Lamp;
